<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Dragon Resonance</title>
<style>
  :root {
    color-scheme: dark;
    --silver: rgba(224, 235, 248, .92);
    --dim: rgba(190, 211, 236, .34);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: white; }
  #stage { position: fixed; inset: 0; background: #000; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 50% 47%, rgba(120,160,210,.16), transparent 19%),
      radial-gradient(circle at 50% 47%, rgba(255,255,255,.035), transparent 43%),
      radial-gradient(circle at 50% 50%, transparent 0 46%, rgba(0,0,0,.58) 76%, #000 100%);
  }
  .hud { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: max(18px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom)); overflow-y: auto; }
  .top { display: flex; justify-content: space-between; font: 600 9px/1.2 ui-monospace, monospace; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.26); }
  .core { display: grid; place-items: center; min-height: 260px; pointer-events: none; }
  .title { text-align: center; transform: translateY(-1vh); }
  .dragon { font-size: clamp(25px, 7vw, 46px); font-weight: 600; letter-spacing: .38em; margin-right: -.38em; text-shadow: 0 0 18px rgba(210,230,255,.22); }
  .resonance { margin-top: 9px; font-size: clamp(11px, 3.1vw, 17px); font-weight: 600; letter-spacing: .34em; margin-right: -.34em; color: rgba(228,238,249,.61); }
  .line { width: 68px; height: 1px; margin: 18px auto 10px; background: linear-gradient(90deg,transparent,rgba(220,235,255,.5),transparent); }
  #state { font: 500 9px/1.2 ui-monospace, monospace; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.28); }
  .panel { width: min(680px, 100%); justify-self: center; border: 1px solid rgba(255,255,255,.09); background: rgba(255,255,255,.025); backdrop-filter: blur(12px); border-radius: 18px; padding: 13px; }
  .moods { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; }
  .moods::-webkit-scrollbar { display: none; }
  button { border: 1px solid rgba(255,255,255,.1); background: rgba(0,0,0,.35); color: rgba(255,255,255,.42); border-radius: 999px; padding: 9px 12px; font: 700 9px/1 ui-monospace, monospace; letter-spacing: .12em; white-space: nowrap; }
  button:focus-visible { outline: 2px solid rgba(225,238,255,.72); outline-offset: 2px; }
  button.active { color: white; border-color: rgba(220,235,255,.38); background: rgba(220,235,255,.08); }
  .bottom { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; margin-top: 11px; }
  .copy { min-width: 0; font: 500 10px/1.45 ui-monospace, monospace; color: rgba(255,255,255,.35); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #awaken { border-radius: 12px; color: white; border-color: rgba(225,238,255,.32); background: rgba(225,238,255,.075); padding: 12px 16px; letter-spacing: .18em; }
  #awaken.on { box-shadow: 0 0 24px rgba(180,215,255,.13); }
  @media (max-height: 520px) {
    .hud { grid-template-rows: auto minmax(200px, 1fr) auto; }
    .core { min-height: 200px; }
    .panel { margin-top: 10px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx"></canvas>
  <div class="vignette"></div>
  <div class="hud">
    <div class="top"><span>Universal Dragon</span><span id="mode">Room Magic Preview</span></div>
    <div class="core">
      <div class="title">
        <div class="dragon">DRAGON</div>
        <div class="resonance">RESONANCE</div>
        <div class="line"></div>
        <div id="state">VOICE SOUL · PLAYFUL</div>
      </div>
    </div>
    <div class="panel">
      <div class="moods" id="moods" aria-label="Dragon mood"></div>
      <div class="bottom">
        <div class="copy" id="copy">Provider-neutral performance plan ready.</div>
        <button type="button" id="awaken">AWAKEN</button>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d', { alpha: true });
  const stateEl = document.getElementById('state');
  const modeEl = document.getElementById('mode');
  const copyEl = document.getElementById('copy');
  const awakenBtn = document.getElementById('awaken');
  const moodsEl = document.getElementById('moods');
  const reduceMotionQuery = matchMedia('(prefers-reduced-motion: reduce)');
  const moods = ['CALM','PLAYFUL','CURIOUS','SERIOUS','WHISPER'];
  let mood = 'PLAYFUL';
  let awakened = false;
  let reduceMotion = reduceMotionQuery.matches;
  let animationRunning = false;
  let w = 0, h = 0, dpr = 1, t = 0;

  const particles = Array.from({length: 54}, (_, i) => ({
    a: (i * 137.508) * Math.PI / 180,
    r: .27 + ((i * 17) % 37) / 100,
    s: .0007 + (i % 7) * .00011,
    l: 8 + (i % 6) * 4,
    p: (i % 9) * .61,
  }));

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (reduceMotion) drawFrame();
  }

  function drawFrame() {
    if (!reduceMotion) t += awakened ? 1.55 : 1;
    ctx.clearRect(0,0,w,h);
    const cx = w * .5, cy = h * .465;
    const base = Math.min(w, h) * .16;

    for (let i = 0; i < 8; i++) {
      const pulse = reduceMotion ? 1 : (1 + Math.sin(t*.018+i)*.006);
      const r = base * (.72 + i * .205) * pulse;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(218,232,249,${.72 - i*.055})`;
      ctx.lineWidth = i < 2 ? 1 : 1.35;
      ctx.shadowColor = 'rgba(170,210,255,.11)';
      ctx.shadowBlur = 12;
      ctx.stroke();
    }

    ctx.shadowBlur = 0;
    const orbit = Math.min(w,h) * .47;
    const visibleParticles = reduceMotion ? particles.slice(0, 16) : particles;
    visibleParticles.forEach((p, i) => {
      const a = p.a + (reduceMotion ? 0 : t * p.s * (i % 2 ? 1 : -1));
      const rr = orbit * p.r;
      const x = cx + Math.cos(a) * rr;
      const y = cy + Math.sin(a) * rr * 1.12;
      const alpha = reduceMotion ? .42 : .2 + .65 * (.5 + .5*Math.sin(t*.024+p.p));
      const len = p.l * (awakened ? 1.25 : 1);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - Math.sin(a)*len, y + Math.cos(a)*len);
      ctx.lineCap = 'round';
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = `rgba(218,233,250,${alpha})`;
      ctx.shadowColor = 'rgba(180,215,255,.42)';
      ctx.shadowBlur = 7;
      ctx.stroke();
    });

    const glow = ctx.createRadialGradient(cx,cy,0,cx,cy,base*.9);
    glow.addColorStop(0, awakened ? 'rgba(210,232,255,.26)' : 'rgba(210,232,255,.16)');
    glow.addColorStop(.45,'rgba(90,140,200,.08)');
    glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx,cy,base*.9,0,Math.PI*2); ctx.fill();
  }

  function animate() {
    if (reduceMotion) {
      animationRunning = false;
      drawFrame();
      return;
    }

    animationRunning = true;
    drawFrame();
    requestAnimationFrame(animate);
  }

  function updateMoodButtons() {
    moodsEl.querySelectorAll('button').forEach(button => {
      const selected = button.textContent === mood;
      button.classList.toggle('active', selected);
      button.setAttribute('aria-pressed', String(selected));
    });
  }

  function createMoodButtons() {
    moods.forEach(name => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = name;
      button.onclick = () => {
        mood = name;
        stateEl.textContent = `VOICE SOUL · ${mood}`;
        updateMoodButtons();
      };
      moodsEl.appendChild(button);
    });
    updateMoodButtons();
  }

  window.dragonAwaken = () => {
    awakened = true;
    modeEl.textContent = 'Resonance Active';
    awakenBtn.textContent = 'ACTIVE';
    awakenBtn.classList.add('on');
    copyEl.textContent = `${mood} performance cue dispatched locally.`;

    if (!reduceMotion) {
      document.documentElement.animate(
        [{filter:'brightness(1)'},{filter:'brightness(1.17)'},{filter:'brightness(1)'}],
        {duration:720,easing:'ease-out'}
      );
    } else {
      drawFrame();
    }

    window.dispatchEvent(new CustomEvent('DRAGON_ROOM_MAGIC_PREVIEW', { detail: { mood } }));
  };

  reduceMotionQuery.addEventListener?.('change', event => {
    reduceMotion = event.matches;
    if (reduceMotion) {
      drawFrame();
    } else if (!animationRunning) {
      animate();
    }
  });

  awakenBtn.onclick = window.dragonAwaken;
  addEventListener('resize', resize, { passive: true });
  resize();
  createMoodButtons();
  animate();
})();
</script>
</body>
</html>
