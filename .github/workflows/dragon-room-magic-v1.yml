name: Dragon Room Magic V1

on:
  push:
    branches:
      - feat/dragon-room-magic-voice-soul-v1
  pull_request:
    paths:
      - 'src/components/DragonResonance.tsx'
      - 'src/components/QuickActions.tsx'
      - 'src/App.tsx'
      - 'src/voice/**'
      - 'room-magic/**'
      - 'tools/proof_voice_soul.ts'
      - '.github/workflows/dragon-room-magic-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Voice Soul deterministic proof
        run: npx tsx tools/proof_voice_soul.ts

      - name: Production build
        run: npm run build

      - name: Verify portable Termux assets
        shell: bash
        run: |
          set -euo pipefail
          test -s room-magic/termux/awaken.html
          test -s room-magic/termux/awaken-v3.sh
          bash -n room-magic/termux/awaken-v3.sh
          grep -q 'DRAGON RESONANCE' room-magic/termux/awaken.html
          echo 'TERMUX_PORTABLE_ASSETS=PASS'
