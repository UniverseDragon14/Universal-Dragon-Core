name: QBIT NOVA v1.1 Portable Launcher

on:
  push:
    branches:
      - nova-v1.4.0-dev
  pull_request:
    branches:
      - nova-v1.4.0-dev

jobs:
  qbit-v11-portable-launcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Launcher syntax
        run: |
          sh -n tools/qbit-nova
          python3 -m py_compile tools/nova_cli.ud
          python3 -m py_compile engine/qbit_nova_v08_tokenizer.py
          python3 -m py_compile engine/qbit_nova_v09_token_parser.py
          python3 -m py_compile engine/qbit_nova_v09_pipeline.py

      - name: Portable launcher contract
        run: |
          chmod +x tools/qbit-nova
          python3 tests/qbit_nova_v11_portable_launcher_check.py

      - name: Manual smoke proof
        run: |
          chmod +x tools/qbit-nova
          ./tools/qbit-nova doctor
          ./tools/qbit-nova native examples/v2/qbit_nova_v07_native_zero.ud
          ./tools/qbit-nova tokens examples/v2/qbit_nova_v07_native_zero.ud
          ./tools/qbit-nova ast-native examples/v2/qbit_nova_v07_native_zero.ud
          ./tools/qbit-nova ir examples/v2/qbit_nova_v07_native_zero.ud
