name: NOVA QBIT Tests

on:
  push:
    branches:
      - nova-v1.3.5-dev
      - nova-v1.4.0-dev
  pull_request:
    branches:
      - nova-v1.3.5-dev
      - nova-v1.4.0-dev

jobs:
  qbit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run QBIT NOVA UD source test
        run: python3 tools/nova_cli.ud run examples/v2/qbit_nova_world.ud

      - name: Run QBIT NOVA UD contract test
        run: python3 tests/qbit_nova_ud_contract_check.py

      - name: Run Bell CNOT single test
        run: python3 nova-lang/v2/nova2_run.py examples/v2/qbit_bell_cnot_test.nova

      - name: Run Bell repeat stability test
        run: |
          python3 tests/qbit_bell_repeat_check.py
          python3 tests/quantum_intent_core_check.py
          python3 tests/nova_qbit_adapter_contracts_check.py

      - name: Run quantum-first syntax parser test
        run: python3 nova-lang/v2/nova2_quantum_syntax.py examples/v2/quantum_first_syntax_test.nova
