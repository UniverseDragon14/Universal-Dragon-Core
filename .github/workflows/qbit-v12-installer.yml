name: QBIT NOVA v1.2 Installer

on:
  push:
    branches:
      - nova-v1.4.0-dev
  pull_request:
    branches:
      - nova-v1.4.0-dev

jobs:
  qbit-v12-installer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Syntax check
        run: |
          sh -n tools/install-qbit-nova.sh
          sh -n tools/qbit-nova
          python3 -m py_compile tools/nova_cli.ud
          python3 -m py_compile tests/qbit_nova_v12_installer_check.py

      - name: Installer contract
        run: |
          chmod +x tools/qbit-nova
          chmod +x tools/install-qbit-nova.sh
          python3 tests/qbit_nova_v12_installer_check.py

      - name: Manual installer smoke proof
        run: |
          chmod +x tools/install-qbit-nova.sh
          ./tools/install-qbit-nova.sh --prefix "$HOME/qbit-nova-ci-prefix"
          "$HOME/qbit-nova-ci-prefix/bin/qbit-nova" doctor
          "$HOME/qbit-nova-ci-prefix/bin/qbit-nova" native examples/v2/qbit_nova_v07_native_zero.ud
