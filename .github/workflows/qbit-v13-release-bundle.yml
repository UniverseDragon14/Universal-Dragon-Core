name: QBIT NOVA v1.3 Release Bundle

on:
  push:
    branches:
      - nova-v1.4.0-dev
  pull_request:
    branches:
      - nova-v1.4.0-dev

jobs:
  qbit-v13-release-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Syntax check
        run: |
          sh -n tools/build-qbit-nova-bundle.sh
          sh -n tools/install-qbit-nova.sh
          sh -n tools/qbit-nova
          python3 -m py_compile tests/qbit_nova_v13_release_bundle_check.py

      - name: Release bundle contract
        run: |
          chmod +x tools/build-qbit-nova-bundle.sh
          chmod +x tools/install-qbit-nova.sh
          chmod +x tools/qbit-nova
          python3 tests/qbit_nova_v13_release_bundle_check.py
